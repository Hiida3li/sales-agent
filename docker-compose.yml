version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  # All backend services share one image (built once) and differ only by the
  # command they run. Tool services select their tool via TOOL_NAME.
  agent-service:
    build: .
    image: agentkit:latest
    command: python -u -m agentkit.services.agent_service
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:29092
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env
    networks:
      - default

  search-products-service:
    image: agentkit:latest
    command: python -u -m agentkit.services.tool_service
    depends_on:
      - agent-service
      - kafka
    environment:
      KAFKA_BROKER: kafka:29092
      TOOL_NAME: search_products
    restart: unless-stopped
    networks:
      - default

  search-faqs-service:
    image: agentkit:latest
    command: python -u -m agentkit.services.tool_service
    depends_on:
      - agent-service
      - kafka
    environment:
      KAFKA_BROKER: kafka:29092
      TOOL_NAME: search_faqs
    restart: unless-stopped
    networks:
      - default

  respond-to-user-service:
    image: agentkit:latest
    command: python -u -m agentkit.services.tool_service
    depends_on:
      - agent-service
      - kafka
    environment:
      KAFKA_BROKER: kafka:29092
      TOOL_NAME: respond_to_user
    restart: unless-stopped
    networks:
      - default

  orchestrator-service:
    image: agentkit:latest
    command: python -u -m agentkit.services.orchestrator_service
    depends_on:
      - agent-service
      - kafka
    environment:
      KAFKA_BROKER: kafka:29092
    restart: unless-stopped
    networks:
      - default

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - default

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

networks:
  default:
    driver: bridge
